workflows:
  unity-ios-workflow:
    name: Unity iOS Workflow
    max_build_duration: 120
    environment:
      groups:
        - ios-credentials
      vars:
        UNITY_VERSION: 6000.4.8f1
        UNITY_VERSION_CHANGESET: f8b72d3d7343
        BUNDLE_ID: com.osirisxstudios.numeracy
    scripts:
      - name: Check Unity installations
        script: |
          echo "=== Unity Hub Editor folder ==="
          ls /Applications/Unity/Hub/Editor/ 2>/dev/null || echo "No editors found"
          echo "=== All Unity installs ==="
          find /Applications -name "Unity" -type f 2>/dev/null || echo "No Unity binary found"
          echo "=== Unity Hub version ==="
          /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub -- --headless version 2>/dev/null || echo "Unity Hub not found"
          echo "=== UNITY_HOME ==="
          echo $UNITY_HOME